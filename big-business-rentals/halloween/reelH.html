<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Archivo Black';src:url('fonts/ArchivoBlack.ttf')}
@font-face{font-family:'Oswald';src:url('fonts/Oswald600.ttf');font-weight:600}
@font-face{font-family:'Montserrat';src:url('fonts/Mont700.ttf');font-weight:700}
@font-face{font-family:'Montserrat';src:url('fonts/Mont600.ttf');font-weight:600}
html,body{margin:0;padding:0;width:540px;height:960px;overflow:hidden;background:#000}
canvas{width:540px;height:960px;display:block}
</style></head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W=1080,H=1920, FLOOR=1560;

const logo = new Image(); logo.src='bb_logo.png';
let logoReady=false; logo.onload=()=>logoReady=true;

// ---------- helpers ----------
const rad = d=>d*Math.PI/180;
const lerp=(a,b,t)=>a+(b-a)*Math.max(0,Math.min(1,t));
const ease=t=>t<0?0:t>1?1:t*t*(3-2*t);
const easeOutBack=t=>{t=Math.max(0,Math.min(1,t));const c=1.70158;return 1+ (c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
function seg(x,y,ang,len){return [x+Math.sin(rad(ang))*len, y+Math.cos(rad(ang))*len];}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

const INK='#241a10', SKIN='#a06a42', SKIN2='#7a4e33', TEE='#f2ede2', PANT='#c9a55a', SHOE='#fdfdfd',
      PURPLE='#2c1247', PURPLE2='#3a1a5e', GOLD='#e5b84b', GOLD2='#B08D3E', PINK='#ff2ea6';

// ---------- chair (side view, backrest on right) ----------
function drawChair(cx, wob, broken, dropT, col){
  const C = Object.assign({a:'#eef0f2', b:'#e3e6ea', c:'#f7f8fa'}, col||{});
  // cx: x of seat center at floor; wob: rock angle deg; broken: 0..1 splay; dropT: seat fall 0..1
  const seatY0 = FLOOR-200, seatW=230, legLen=185;
  ctx.save();
  ctx.translate(cx, FLOOR);
  ctx.rotate(rad(wob));
  ctx.lineWidth=16; ctx.strokeStyle=INK; ctx.lineCap='round';
  const splay = broken*38;             // legs splay out
  const drop  = dropT*(legLen-55);     // seat falls
  // rear legs (right, holds backrest)
  ctx.save();
  ctx.translate(seatW/2-20, 0);
  ctx.rotate(rad(14+splay));
  ctx.fillStyle=C.a;
  rr(-14,-legLen,28,legLen,12); ctx.fill(); ctx.stroke();
  ctx.restore();
  // front legs (left)
  ctx.save();
  ctx.translate(-seatW/2+20, 0);
  ctx.rotate(rad(-14-splay));
  ctx.fillStyle=C.b;
  rr(-14,-legLen,28,legLen,12); ctx.fill(); ctx.stroke();
  ctx.restore();
  const seatY = -legLen+30+drop;
  // seat
  ctx.save();
  ctx.translate(0, seatY);
  ctx.rotate(rad(broken*10));
  ctx.fillStyle=C.c;
  rr(-seatW/2-14, -16, seatW+28, 40, 14); ctx.fill(); ctx.stroke();
  ctx.restore();
  // backrest (attached to rear legs top)
  ctx.save();
  const bx = (seatW/2-20)+Math.sin(rad(14+splay))*(-legLen), by = Math.cos(rad(14+splay))*(-legLen);
  ctx.translate(bx,by+drop*0.9);
  ctx.rotate(rad(-(14+splay)*0.4 + broken*22));
  ctx.fillStyle=C.c;
  rr(-22,-150,44,150,15); ctx.fill(); ctx.stroke();
  rr(-92,-162,184,58,17); ctx.fill(); ctx.stroke();
  ctx.restore();
  ctx.restore();
}

// ---------- man ----------
// pose: x,y(hip), face(1 right,-1 left), lean (torso deg, + = lean back),
// legs [{hip,knee}...] angles: hip 0=down, + forward; walkT for bob; rot: whole-body rotation (fall)
function drawMan(p){
  const S = Object.assign({tee:TEE, teeShade:'#e4ddc9', cap:'#4b2377', skin:SKIN, pant:PANT, pantBack:'#a8874a', capless:false, fem:false}, p.style||{});
  ctx.save();
  ctx.translate(p.x,p.y);
  ctx.rotate(rad(p.rot||0));
  ctx.scale(p.face,1);
  ctx.lineWidth=12; ctx.strokeStyle=INK; ctx.lineCap='round'; ctx.lineJoin='round';
  const thigh=118, shin=116;
  // legs
  [1,0].forEach((i,ord)=>{
    const L=p.legs[i];
    const back=(ord===0);
    const [kx,ky]=seg(0,6, L.hip, thigh);
    const [fx,fy]=seg(kx,ky, L.hip+L.knee, shin);
    ctx.lineWidth=54; ctx.strokeStyle=back?S.pantBack:S.pant;
    ctx.beginPath();ctx.moveTo(0,6);ctx.lineTo(kx,ky);ctx.lineTo(fx,fy);ctx.stroke();
    ctx.lineWidth=11; ctx.strokeStyle=INK;
    ctx.beginPath();ctx.moveTo(0,6);ctx.lineTo(kx,ky);ctx.lineTo(fx,fy);ctx.stroke();
    ctx.save();
    ctx.translate(fx,fy); ctx.rotate(rad(-(L.hip+L.knee)*0.2));
    ctx.fillStyle=back?'#dedede':SHOE;
    rr(-26,-14,102,42,19); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#b9bec4'; rr(-26,16,102,12,6); ctx.fill();
    ctx.restore();
  });
  // torso
  ctx.save();
  ctx.rotate(rad(-(p.lean||0)));
  ctx.fillStyle=S.tee;
  ctx.beginPath();
  ctx.moveTo(-58,14);
  ctx.bezierCurveTo(-108,-66,-98,-196,-42,-232);
  ctx.bezierCurveTo(8,-258,78,-242,94,-188);
  ctx.bezierCurveTo(150,-116,156,-36,120,10);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle=S.teeShade;
  ctx.beginPath(); ctx.ellipse(72,-56,56,82,rad(-14),0,7); ctx.fill();
  ctx.strokeStyle=INK; ctx.lineWidth=8;
  ctx.beginPath(); ctx.moveTo(-54,8); ctx.quadraticCurveTo(38,30,116,4); ctx.stroke();
  // gold chain
  ctx.strokeStyle=GOLD; ctx.lineWidth=10;
  ctx.beginPath(); ctx.moveTo(2,-220); ctx.quadraticCurveTo(58,-164,92,-192); ctx.stroke();
  // back arm (optional)
  if(p.arm2){
    const B=p.arm2;
    ctx.save();
    ctx.translate(-6,-202);
    const [ex2,ey2]=seg(0,0, B.sh, 100);
    const [hx2,hy2]=seg(ex2,ey2, B.sh+B.el, 96);
    ctx.lineWidth=46; ctx.strokeStyle='#d8d2c2';
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(ex2,ey2);ctx.stroke();
    ctx.lineWidth=34; ctx.strokeStyle=SKIN2;
    ctx.beginPath();ctx.moveTo(ex2,ey2);ctx.lineTo(hx2,hy2);ctx.stroke();
    ctx.lineWidth=11; ctx.strokeStyle=INK;
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(ex2,ey2);ctx.lineTo(hx2,hy2);ctx.stroke();
    ctx.fillStyle=SKIN2; ctx.beginPath(); ctx.arc(hx2,hy2,23,0,7); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  // arm
  const A=p.arm||{sh:35, el:40};
  ctx.save();
  ctx.translate(30,-198);
  const [ex,ey]=seg(0,0, A.sh, 100);
  const [hx,hy]=seg(ex,ey, A.sh+A.el, 96);
  ctx.lineWidth=46; ctx.strokeStyle=S.tee;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(ex,ey);ctx.stroke();
  ctx.lineWidth=34; ctx.strokeStyle=SKIN;
  ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(hx,hy);ctx.stroke();
  ctx.lineWidth=11; ctx.strokeStyle=INK;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(ex,ey);ctx.lineTo(hx,hy);ctx.stroke();
  ctx.fillStyle=SKIN; ctx.beginPath(); ctx.arc(hx,hy,23,0,7); ctx.fill(); ctx.stroke();
  ctx.restore();
  // head (drawn AFTER arm so it overlaps)
  ctx.save();
  ctx.translate(30,-252); ctx.rotate(rad(p.headTilt||0));
  ctx.lineWidth=11;
  ctx.fillStyle=S.skin;
  ctx.beginPath(); ctx.arc(0,-56,72,0,7); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(-52,-52,15,0,7); ctx.fill(); ctx.stroke(); // ear
  // backwards cap: dome on top + strap at back
  if(S.fem){
    ctx.fillStyle='#241a10';
    ctx.beginPath(); ctx.arc(0,-64,76,rad(168),rad(372)); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(-44,-136,36,0,7); ctx.fill(); ctx.stroke();   // bun
    ctx.strokeStyle=GOLD; ctx.lineWidth=8;
    ctx.beginPath(); ctx.arc(-44,-136,44,rad(120),rad(300)); ctx.stroke(); // scrunchie glint
    ctx.strokeStyle=INK; ctx.lineWidth=11;
    // gold hoop earring
    ctx.strokeStyle=GOLD; ctx.lineWidth=7;
    ctx.beginPath(); ctx.arc(-52,-18,17,rad(-30),rad(210)); ctx.stroke();
    ctx.strokeStyle=INK; ctx.lineWidth=11;
  } else if(!S.capless){
  ctx.fillStyle=S.cap;
  ctx.beginPath(); ctx.arc(0,-62,74,rad(175),rad(355)); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-70,-84); ctx.quadraticCurveTo(-128,-76,-124,-56);
  ctx.quadraticCurveTo(-90,-56,-66,-62); ctx.closePath(); ctx.fill(); ctx.stroke();  // back brim
  ctx.fillStyle=GOLD; ctx.beginPath(); ctx.arc(6,-96,10,0,7); ctx.fill();  // cap button
  } else {
    ctx.fillStyle='#241a10';
    ctx.beginPath(); ctx.arc(0,-70,68,rad(180),rad(360)); ctx.closePath(); ctx.fill(); ctx.stroke(); // short hair
  }
  // eyes (front = +x)
  if(p.eyes==='x'){
    ctx.lineWidth=8; ctx.strokeStyle=INK;
    [[26,-56],[54,-50]].forEach(([x,y])=>{
      ctx.beginPath();ctx.moveTo(x-9,y-9);ctx.lineTo(x+9,y+9);ctx.moveTo(x+9,y-9);ctx.lineTo(x-9,y+9);ctx.stroke();
    });
  } else if(p.eyes==='wide'){
    ctx.fillStyle='#fff'; ctx.lineWidth=6;
    ctx.beginPath();ctx.arc(28,-56,15,0,7);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.arc(56,-50,13,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle=INK;
    ctx.beginPath();ctx.arc(31,-54,6,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(58,-48,5.5,0,7);ctx.fill();
  } else {
    ctx.fillStyle=INK;
    ctx.beginPath();ctx.arc(28,-56,7,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(56,-50,6.5,0,7);ctx.fill();
  }
  // brows
  ctx.lineWidth=8; ctx.strokeStyle=INK;
  ctx.beginPath();ctx.moveTo(18,-76);ctx.lineTo(38,-72);ctx.stroke();
  ctx.beginPath();ctx.moveTo(48,-68);ctx.lineTo(64,-64);ctx.stroke();
  // mouth + chin beard line
  if(p.mouth==='o'){ctx.fillStyle='#5a2c22';ctx.beginPath();ctx.ellipse(46,-16,13,18,0,0,7);ctx.fill();ctx.stroke();}
  else if(p.mouth==='sad'){ctx.beginPath();ctx.arc(44,0,15,rad(200),rad(340));ctx.stroke();}
  else {ctx.beginPath();ctx.arc(40,-26,16,rad(30),rad(140));ctx.stroke();}
  // goatee (men) / lashes (women)
  if(!S.fem){
    ctx.fillStyle='#241a10';
    ctx.beginPath(); ctx.ellipse(46,4,14,10,0,0,7); ctx.fill();
  } else {
    ctx.lineWidth=5; ctx.strokeStyle=INK;
    ctx.beginPath();ctx.moveTo(20,-68);ctx.lineTo(12,-74);ctx.stroke();
    ctx.beginPath();ctx.moveTo(50,-62);ctx.lineTo(44,-69);ctx.stroke();
  }
  ctx.restore();
  ctx.restore();
  ctx.restore();
}
// ---------- fx ----------
function starburst(x,y,s,label){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rad(-8)); ctx.scale(s,s);
  ctx.beginPath();
  const spikes=14;
  for(let i=0;i<spikes*2;i++){
    const a=i*Math.PI/spikes, r=i%2? 118:205+(i%4)*24;
    ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r*0.82);
  }
  ctx.closePath();
  ctx.fillStyle='#ffd94d'; ctx.fill();
  ctx.lineWidth=12; ctx.strokeStyle=INK; ctx.stroke();
  ctx.fillStyle=INK;
  ctx.font='66px "Archivo Black"'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(label,0,6);
  ctx.restore();
}
function dust(x,y,t){ // t 0..1
  if(t<=0||t>=1)return;
  ctx.save(); ctx.globalAlpha=(1-t)*0.8;
  for(let i=0;i<7;i++){
    const a=i/7*Math.PI, r=40+t*150+(i%3)*22;
    ctx.fillStyle='#cfc8bb';
    ctx.beginPath(); ctx.arc(x+Math.cos(a+2)*r*1.3, y-Math.abs(Math.sin(a))*r*0.5, 26+18*(1-t),0,7); ctx.fill();
  }
  ctx.restore();
}
function dizzyStars(x,y,t){
  ctx.save();
  for(let i=0;i<3;i++){
    const a=t*4+i*2.09;
    const sx=x+Math.cos(a)*95, sy=y+Math.sin(a)*26 - 8;
    ctx.save(); ctx.translate(sx,sy); ctx.rotate(a); ctx.fillStyle=GOLD;
    ctx.beginPath();
    for(let k=0;k<10;k++){const r=k%2?7:17, aa=k*Math.PI/5;ctx.lineTo(Math.cos(aa)*r,Math.sin(aa)*r);}
    ctx.closePath(); ctx.fill(); ctx.strokeStyle=INK; ctx.lineWidth=3; ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}
function caption(lines,y,popT,size){
  const s=size||64;
  const sc=easeOutBack(popT);
  if(sc<=0)return;
  ctx.save(); ctx.translate(W/2,y); ctx.scale(sc,sc);
  ctx.font=s+'px "Archivo Black"'; ctx.textAlign='center';
  lines.forEach((ln,i)=>{
    ctx.lineWidth=16; ctx.strokeStyle=INK; ctx.strokeText(ln,0,i*(s*1.18));
    ctx.fillStyle='#fff'; ctx.fillText(ln,0,i*(s*1.18));
  });
  ctx.restore();
}

// ---------- scene bg ----------
function drawRoom(){
  // purple wall (brand), floor, spotlight
  const g=ctx.createLinearGradient(0,0,0,FLOOR);
  g.addColorStop(0,'#1c0b30'); g.addColorStop(1,PURPLE2);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,FLOOR);
  // string lights
  ctx.strokeStyle='rgba(229,184,75,.5)'; ctx.lineWidth=4;
  ctx.beginPath(); ctx.moveTo(0,140); ctx.quadraticCurveTo(W/2,260,W,120); ctx.stroke();
  for(let i=1;i<9;i++){
    const x=i/9*W, y=140+Math.sin(i/9*Math.PI)*112;
    ctx.fillStyle=GOLD; ctx.beginPath(); ctx.arc(x,y+10,9,0,7); ctx.fill();
    ctx.fillStyle='rgba(229,184,75,.18)'; ctx.beginPath(); ctx.arc(x,y+10,26,0,7); ctx.fill();
  }
  // spotlight cone
  ctx.fillStyle='rgba(255,240,200,.07)';
  ctx.beginPath(); ctx.moveTo(430,0); ctx.lineTo(780,0); ctx.lineTo(1010,FLOOR); ctx.lineTo(180,FLOOR); ctx.closePath(); ctx.fill();
  // floor
  const fg=ctx.createLinearGradient(0,FLOOR,0,H);
  fg.addColorStop(0,'#6a5138'); fg.addColorStop(1,'#4a3826');
  ctx.fillStyle=fg; ctx.fillRect(0,FLOOR,W,H-FLOOR);
  ctx.strokeStyle='rgba(36,26,16,.35)'; ctx.lineWidth=5;
  for(let i=0;i<6;i++){ctx.beginPath();ctx.moveTo(0,FLOOR+40+i*60);ctx.lineTo(W,FLOOR+40+i*60);ctx.stroke();}
  ctx.fillStyle='rgba(0,0,0,.28)';
  ctx.beginPath(); ctx.ellipse(620,FLOOR+18,330,40,0,0,7); ctx.fill();
}

// ---------- end card ----------
function drawEndCard(t){ // t seconds since card start
  const g=ctx.createRadialGradient(W/2,760,80,W/2,900,1200);
  g.addColorStop(0,PURPLE2); g.addColorStop(1,'#190a2c');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // rotating rays
  ctx.save(); ctx.translate(W/2,700); ctx.rotate(t*0.12);
  ctx.strokeStyle='rgba(229,184,75,.20)'; ctx.lineWidth=3;
  for(let i=0;i<18;i++){ctx.rotate(Math.PI/9);ctx.beginPath();ctx.moveTo(0,90);ctx.lineTo(0,760);ctx.stroke();}
  ctx.restore();
  // logo bounce
  const sc=easeOutBack(Math.min(1,t/0.7))*1;
  if(logoReady&&sc>0){
    const size=640*sc;
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,.55)'; ctx.shadowBlur=60; ctx.shadowOffsetY=22;
    ctx.drawImage(logo, W/2-size/2, 700-size/2, size, size);
    ctx.restore();
  }
  const a1=ease((t-0.7)/0.4), a2=ease((t-1.0)/0.4), a3=ease((t-1.3)/0.4);
  ctx.textAlign='center';
  ctx.save(); ctx.globalAlpha=a1;
  const tag = (window.TAGLINES&&TAGLINES[REEL]) || 'STRONG CHAIRS. NO SURPRISES.';
  let fs=46; ctx.letterSpacing='10px';
  ctx.font='600 '+fs+'px Oswald';
  while(ctx.measureText(tag).width>950 && fs>32){fs-=2;ctx.font='600 '+fs+'px Oswald';}
  ctx.fillStyle=GOLD;
  ctx.fillText(tag, W/2, 1180);
  ctx.letterSpacing='0px';
  ctx.restore();
  ctx.save(); ctx.globalAlpha=a2;
  ctx.font='96px "Archivo Black"';
  const gg=ctx.createLinearGradient(0,1260,0,1360);
  gg.addColorStop(0,'#EFCB7C'); gg.addColorStop(1,GOLD2);
  ctx.fillStyle=gg;
  ctx.fillText('702-706-8287', W/2, 1338);
  ctx.restore();
  ctx.save(); ctx.globalAlpha=a3;
  ctx.font='700 44px Montserrat'; ctx.fillStyle='#F3D88F';
  ctx.fillText('bigbusinesspartyrentals.com', W/2, 1424);
  ctx.font='700 40px Montserrat'; ctx.fillStyle='#efe9dc';
  ctx.fillText('IG  @bigbusiness_rentals_events', W/2, 1492);
  ctx.font='600 34px Oswald'; ctx.fillStyle='rgba(229,184,75,.85)';
  ctx.fillText('L A S   V E G A S ,  N V', W/2, 1552);
  ctx.restore();
  // book now pill
  const a4=ease((t-1.6)/0.5);
  if(a4>0){
    ctx.save(); ctx.globalAlpha=a4;
    const pw=430,ph=90,px=W/2-pw/2,py=1608;
    const pg=ctx.createLinearGradient(0,py,0,py+ph);
    pg.addColorStop(0,'#EFCB7C');pg.addColorStop(1,GOLD2);
    ctx.fillStyle=pg; rr(px,py,pw,ph,46); ctx.fill();
    ctx.fillStyle='#1c0b30'; ctx.font='600 46px Oswald';
    ctx.fillText('BOOK YOUR DATE', W/2, py+59);
    ctx.restore();
  }
}


// ---------- extra props ----------
function drawTable(cx, wob, collapseT){
  ctx.save(); ctx.translate(cx, FLOOR); ctx.rotate(rad(wob));
  ctx.lineWidth=15; ctx.strokeStyle=INK; ctx.lineCap='round';
  const topW=620, legLen=250, splay=collapseT*62, drop=collapseT*(legLen-46);
  [[-1,'#dfe2e6'],[1,'#eef0f2']].forEach(([s,c])=>{
    ctx.save(); ctx.translate(s*(topW/2-70),0); ctx.rotate(rad(s*(10+splay)));
    ctx.fillStyle=c; rr(-13,-legLen,26,legLen,11); ctx.fill(); ctx.stroke(); ctx.restore();
  });
  ctx.save(); ctx.translate(0,-legLen+18+drop); ctx.rotate(rad(collapseT*7));
  ctx.fillStyle='#f7f8fa'; rr(-topW/2,-17,topW,38,13); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#e8eaee'; rr(-topW/2,-17,topW,12,6); ctx.fill();
  ctx.restore(); ctx.restore();
}
function drawCake(x,y,s,tilt){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rad(tilt||0)); ctx.scale(s,s);
  ctx.lineWidth=9; ctx.strokeStyle=INK;
  ctx.fillStyle='#e9ecf0'; ctx.beginPath(); ctx.ellipse(0,4,95,16,0,0,7); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#f6d7e3'; rr(-70,-58,140,60,10); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#fff'; ctx.beginPath();
  ctx.moveTo(-70,-58); ctx.quadraticCurveTo(-52,-30,-38,-52); ctx.quadraticCurveTo(-22,-26,-6,-52);
  ctx.quadraticCurveTo(8,-28,24,-52); ctx.quadraticCurveTo(40,-26,56,-52); ctx.quadraticCurveTo(64,-40,70,-58);
  ctx.lineTo(70,-58); ctx.lineTo(-70,-58); ctx.fill();
  ctx.fillStyle='#c22b45'; ctx.beginPath(); ctx.arc(0,-70,12,0,7); ctx.fill(); ctx.stroke();
  ctx.restore();
}
function drawFoldedStack(x,y,n,sway){
  ctx.save(); ctx.translate(x,y);
  for(let i=0;i<n;i++){
    ctx.save();
    ctx.rotate(rad(sway*(i+1)*0.35));
    ctx.translate(0,-i*40);
    ctx.lineWidth=10; ctx.strokeStyle=INK;
    ctx.fillStyle=i%2?'#f7f8fa':'#e8eaee';
    rr(-105,-34,210,34,12); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}
function drawMiniChair(x,y,s,col){
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  ctx.lineWidth=9; ctx.strokeStyle=INK;
  ctx.fillStyle=col||'#f2f4f6';
  rr(-46,-160,20,96,8); ctx.fill(); ctx.stroke();
  rr(-52,-176,80,30,9); ctx.fill(); ctx.stroke();
  rr(-58,-70,116,24,9); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-46,-48); ctx.lineTo(-58,0); ctx.moveTo(46,-48); ctx.lineTo(58,0); ctx.stroke();
  ctx.restore();
}
function notes(t, cx, cy){
  ctx.save(); ctx.font='64px Montserrat'; ctx.fillStyle=GOLD;
  for(let i=0;i<3;i++){
    const ph=(t*0.9+i*0.37)%1;
    const x=cx+Math.sin((t+i)*2.2)*70+i*90-90, y=cy-ph*220;
    ctx.globalAlpha=Math.min(1,(1-ph)*1.6)*0.9;
    ctx.fillText(i%2?'♪':'♫', x, y);
  }
  ctx.restore();
}
function sweat(x,y,t){

    const x1=x+w-(i+0.5)*(2*w/n), x0=x+w-(i+1)*(2*w/n);

    ctx.quadraticCurveTo(x1, y+26*s+dy, x0, y);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  if(o.reach){
    ctx.lineWidth=26*s; ctx.strokeStyle='#f3f1ff';
    ctx.beginPath();
    ctx.moveTo(x+w*0.5, top+150*s);
    ctx.quadraticCurveTo((x+o.hx)/2, top+110*s, o.hx, o.hy);
    ctx.stroke();
    ctx.lineWidth=7; ctx.strokeStyle=INK; ctx.fillStyle='#f3f1ff';
    ctx.beginPath(); ctx.arc(o.hx,o.hy,17*s,0,7); ctx.fill(); ctx.stroke();
  }
  const ex=28*s, ey=top+95*s;
  ctx.fillStyle='#141021';
  const eh=(o.eyes==='wide')?17*s:12*s;
  ctx.beginPath(); ctx.ellipse(x-ex,ey,9*s,eh,0,0,7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+ex,ey,9*s,eh,0,0,7); ctx.fill();
  ctx.lineWidth=6*s;
  if(o.mouth==='smile'){
    ctx.beginPath(); ctx.arc(x, ey+34*s, 18*s, 0.25, Math.PI-0.25); ctx.stroke();
  } else if(o.mouth==='sad'){
    ctx.beginPath(); ctx.arc(x, ey+60*s, 18*s, Math.PI+0.3, -0.3); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.ellipse(x, ey+42*s, 10*s, 15*s, 0, 0, 7); ctx.fill();
  }
  ctx.restore();
}
function reelH8(t){
  drawRoomH(t);
  const RX=560, NX=840;
  if(t>0.15){
    const k=easeOutBack(Math.min(1,(t-0.15)/0.35));
    ctx.save(); ctx.translate(RX,FLOOR); ctx.scale(k,k); ctx.translate(-RX,-FLOOR);
    drawChair(RX,0,0,0,{a:'#e05252',b:'#c94444',c:'#ef6d6d'});
    ctx.restore();
  }
  if(t>=4.4){
    const k=ease(Math.min(1,(t-4.4)/0.6));
    drawChair(lerp(W+240,NX,k),0,0,0);
    if(t>6.6) sparkle(NX+40, SEAT_TOP-150, t);
  }
  const bob=Math.sin(t*3)*14;
  let gx=0,gy=0,o={mouth:'o'};
  if(t<1.4){ gx=lerp(-180,RX-190,ease(t/1.4)); gy=FLOOR-150+bob; }
  else if(t<2.7){
    gx=RX-190+(t>1.6?ease(Math.min(1,(t-1.6)/0.5))*40:0);
    gy=FLOOR-150+bob;
    if(t>1.6&&t<2.4) o={mouth:'o', reach:true, hx:RX+30, hy:FLOOR-370, eyes:(t>1.95?'wide':undefined)};
    else if(t>=2.4) o={mouth:'sad', eyes:'wide'};
    if(t>=1.95&&t<2.7){const kk=easeOutBack(Math.min(1,(t-1.95)/0.3)); starburst(RX-60,FLOOR-600,kk*0.85,'SWISH!');}
  }
  else if(t<3.0){
    const k=ease((t-2.7)/0.3);
    gx=lerp(RX-150,RX-10,k); gy=FLOOR-190+bob*0.5;
  }
  else if(t<4.1){
    const k=ease(Math.min(1,(t-3.0)/0.7));
    gx=RX-10; gy=lerp(FLOOR-190,FLOOR-6,k);
    o={mouth:(k>0.6?'sad':'o'), eyes:(k>0.4?'wide':undefined)};
    if(t>=3.55&&t<4.1){const kk=easeOutBack(Math.min(1,(t-3.55)/0.3)); starburst(RX+260,FLOOR-540,kk*0.9,'WHIFF!');}
    if(t>=3.5) dust(RX,FLOOR,(t-3.5)/0.8);
  }
  else if(t<5.2){
    const k=ease((t-4.1)/1.1);
    gx=lerp(RX-10,NX-10,k); gy=lerp(FLOOR-6,FLOOR-190,Math.min(1,k*1.6))+bob*k;
    o={mouth:'sad'};
  }
  else if(t<6.1){
    const k=ease((t-5.2)/0.9);
    gx=NX-10; gy=lerp(FLOOR-190,SEAT_TOP+6,k);
    o={mouth:'o', eyes:(k>0.8?'wide':undefined)};
  }
  else {
    const settle=Math.max(0,1-(t-6.1)*3);
    gx=NX-10;
    gy=SEAT_TOP+6-Math.sin((t-6.1)*12)*8*settle+Math.sin(t*2.5)*3;
    o={mouth:'smile'};
  }
  drawGhost(gx,gy,1.55,t,o);
  if(t>=0.3&&t<1.8) caption(['THE PARTY HAS AN','UNINVITED GUEST…'],240,(t-0.3)/0.35,56);
  if(t>=2.1&&t<3.0) caption(['RIGHT THROUGH','THE CHEAP CHAIR.'],240,(t-2.1)/0.35,58);
  if(t>=3.7&&t<4.8) caption(['CHEAP CHAIRS WON\'T','EVEN HOLD A SPIRIT.'],240,(t-3.7)/0.35,54);
  if(t>=6.4&&t<7.4) caption(['OUR CHAIRS?','GHOST-PROOF.'],240,(t-6.4)/0.35);
  if(t>=7.6&&t<8.9) caption(['REAL SEATS.','SUPERNATURAL QUALITY.'],240,(t-7.6)/0.35,52);
}
REELS[8]=reelH8;
SHAKES[8]=[3.55,0.3,16];
TAGLINES[8]='SO SOLID, EVEN SPIRITS STAY SEATED.';
