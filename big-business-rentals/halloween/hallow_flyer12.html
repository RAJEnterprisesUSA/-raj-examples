<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Archivo Black';src:url('fonts/ArchivoBlack.ttf')}
@font-face{font-family:'Playfair';src:url('fonts/Playfair900.ttf');font-weight:900}
@font-face{font-family:'Oswald';src:url('fonts/Oswald600.ttf');font-weight:600}
@font-face{font-family:'Montserrat';src:url('fonts/Mont600.ttf');font-weight:600}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden}
body{position:relative;font-family:'Montserrat';color:#f6ecc9;
  background:radial-gradient(circle at 50% 36%, #241040 0%, #140823 50%, #060309 100%)}
.glow{position:absolute;left:50%;top:46%;width:760px;height:760px;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(255,140,46,.22),transparent 62%)}
.grain{position:absolute;inset:0;opacity:.11;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='300' height='300' filter='url(%23n)' opacity='1'/></svg>")}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,.55) 100%)}
.frame{position:absolute;inset:30px;border:2px solid #B08D3E}
.frame:after{content:'';position:absolute;inset:7px;border:1px solid rgba(255,140,46,.45)}
.dia{position:absolute;width:11px;height:11px;background:#ff8c2e;transform:rotate(45deg)}
.bat{position:absolute;font-size:40px;opacity:.9}
.wrap{position:absolute;inset:30px;display:flex;flex-direction:column;align-items:center;text-align:center;padding:58px 70px 44px}
.kick{font-family:'Oswald';font-weight:600;font-size:25px;letter-spacing:10px;color:#ff8c2e}
.script{font-family:'Playfair';font-weight:900;font-style:italic;font-size:60px;color:#c9a9f0;margin-top:20px;line-height:1}
.bignum{position:relative;font-family:'Archivo Black';font-size:430px;line-height:.92;margin-top:2px;color:#1a0d2e;
  -webkit-text-stroke:6px #ff8c2e;
  text-shadow:0 0 70px rgba(255,140,46,.65), 0 0 160px rgba(255,170,60,.35)}
.bignum em{font-style:normal}
.nights{font-family:'Archivo Black';font-size:64px;letter-spacing:6px;color:#f6f1e4;margin-top:-10px}
.nights em{font-style:normal;color:#ff8c2e}
.sub{margin-top:22px;font-weight:600;font-size:26px;color:#d9c9ef;line-height:1.5;max-width:820px}
.sub b{color:#E5B84B}
.foot{margin-top:auto;display:flex;align-items:center;gap:22px}
.foot img{width:76px;height:76px}
.foot .p{font-family:'Archivo Black';font-size:32px;color:#E5B84B;text-align:left}
.foot .s{font-weight:600;font-size:17px;color:#d9cdb2;margin-top:3px;text-align:left}
</style></head>
<body>
  <div class="glow"></div>
  <div class="grain"></div>
  <div class="vig"></div>
  <div class="frame"></div>
  <div class="dia" style="left:25px;top:25px"></div><div class="dia" style="right:25px;top:25px"></div>
  <div class="dia" style="left:25px;bottom:25px"></div><div class="dia" style="right:25px;bottom:25px"></div>
  <div class="bat" style="left:150px;top:150px;transform:rotate(-14deg)">🦇</div>
  <div class="bat" style="right:190px;top:120px;transform:rotate(10deg);font-size:52px">🦇</div>
  <div class="bat" style="right:120px;top:250px;transform:rotate(-6deg);font-size:30px">🦇</div>
  <div class="bat" style="left:110px;top:300px;transform:rotate(8deg);font-size:34px">🦇</div>
  <div class="wrap">
    <div class="kick">◆&nbsp; HALLOWEEN COUNTDOWN &nbsp;◆</div>
    <div class="script">the jack-o-lanterns know</div>
    <div class="bignum">25</div>
    <div class="nights">NIGHTS <em>LEFT.</em></div>
    <div class="sub">Every carved pumpkin on the block is counting with us. Tables, chairs and the party room, <b>booked before the glow goes out.</b></div>
    <div class="foot">
      <img src="bb_logo.png">
      <div>
        <div class="p">702-706-8287</div>
        <div class="s">bigbusinesspartyrentals.com &nbsp;·&nbsp; @bigbusiness_rentals_events &nbsp;·&nbsp; LAS VEGAS, NV</div>
      </div>
    </div>
  </div>
</body></html>
