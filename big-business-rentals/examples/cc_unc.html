<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Archivo Black';src:url('fonts/ArchivoBlack.ttf')}
@font-face{font-family:'Playfair';src:url('fonts/Playfair900.ttf');font-weight:900}
@font-face{font-family:'Oswald';src:url('fonts/Oswald600.ttf');font-weight:600}
@font-face{font-family:'Montserrat';src:url('fonts/Mont600.ttf');font-weight:600}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden}
body{position:relative;font-family:'Montserrat';color:#f2ecdd;
  background:radial-gradient(circle at 42% 26%, #23201a 0%, #060606 78%)}
.grain{position:absolute;inset:0;opacity:.10;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='300' height='300' filter='url(%23n)' opacity='1'/></svg>")}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,.52) 100%)}
.frame{position:absolute;inset:34px;border:2px solid #B08D3E}
.dia{position:absolute;width:12px;height:12px;background:#D6B25E;transform:rotate(45deg)}
.ghost{position:absolute;right:-40px;top:120px;font-family:'Archivo Black';font-size:540px;line-height:1;
  color:transparent;-webkit-text-stroke:3px rgba(229,184,75,.20);letter-spacing:-14px}
.stamp{position:absolute;top:96px;right:84px;transform:rotate(7deg);
  font-family:'Oswald';font-weight:600;font-size:24px;letter-spacing:4px;color:#241a35;
  background:linear-gradient(180deg,#EFCB7C,#B08D3E);padding:12px 28px;border-radius:10px;
  box-shadow:0 14px 34px rgba(0,0,0,.45)}
.wrap{position:absolute;inset:34px;padding:66px 72px 54px;display:flex;flex-direction:column;align-items:flex-start}
.kick{font-family:'Oswald';font-weight:600;font-size:23px;letter-spacing:7px;color:#bdb29b}
h1{font-family:'Archivo Black';font-size:104px;line-height:1.02;margin-top:26px;color:#f6f1e4}
h1 em{font-style:normal;background:linear-gradient(180deg,#EFCB7C,#B08D3E 70%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font-family:'Playfair';font-weight:900;font-style:italic;font-size:46px;color:#bdb29b;margin-top:24px}
.stats{margin-top:46px;display:flex;flex-direction:column;gap:20px}
.s{display:flex;flex-direction:column}
.s .l{font-family:'Oswald';font-weight:600;font-size:21px;letter-spacing:5px;color:#D6B25E}
.s .v{font-weight:600;font-size:30px;color:#efe6d2;margin-top:4px}
.sprite{position:absolute;right:66px;bottom:214px;height:630px;
  filter:drop-shadow(-22px 30px 26px rgba(0,0,0,.55))}
.shadow{position:absolute;right:70px;bottom:196px;width:360px;height:44px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(0,0,0,.5),transparent 70%)}
.foot{position:absolute;left:106px;right:106px;bottom:84px;display:flex;align-items:center;gap:22px;
  border-top:1px solid rgba(229,184,75,.4);padding-top:24px}
.foot img{width:78px;height:78px}
.foot .p{font-family:'Archivo Black';font-size:33px;color:#E5B84B}
.foot .s2{font-weight:600;font-size:17px;color:#d9cdb2;margin-top:4px}
</style></head>
<body>
  <div class="ghost">03</div>
  <div class="grain"></div><div class="vig"></div>
  <div class="frame"></div>
  <div class="dia" style="left:29px;top:29px"></div><div class="dia" style="right:29px;top:29px"></div>
  <div class="dia" style="left:29px;bottom:29px"></div><div class="dia" style="right:29px;bottom:29px"></div>
  <div class="stamp">★ CAST FILE No.03</div>
  <div class="shadow"></div>
  <img class="sprite" src="sp_unc.png">
  <div class="wrap">
    <div class="kick">THE BIG BUSINESS CHRONICLES · SEASON ONE</div>
    <h1><em>UNC.</em></h1>
    <div class="tag">He knows a shortcut.</div>
    <div class="stats"><div class="s"><div class="l">LISTENS</div><div class="v">Never</div></div><div class="s"><div class="l">CHAIR LEAN</div><div class="v">Illegal angles</div></div><div class="s"><div class="l">SUPERSTITION</div><div class="v">Maximum</div></div></div>
  </div>
  <div class="foot">
    <img src="bb_logo.png">
    <div>
      <div class="p">702-706-8287</div>
      <div class="s2">bigbusinesspartyrentals.com &nbsp;·&nbsp; @bigbusiness_rentals_events &nbsp;·&nbsp; LAS VEGAS, NV</div>
    </div>
  </div>
</body></html>
