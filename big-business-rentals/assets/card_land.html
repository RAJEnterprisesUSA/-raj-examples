<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Archivo Black';src:url('fonts/ArchivoBlack.ttf')}
@font-face{font-family:'Oswald';src:url('fonts/Oswald600.ttf');font-weight:600}
@font-face{font-family:'Montserrat';src:url('fonts/Mont700.ttf');font-weight:700}
html,body{margin:0;padding:0;width:640px;height:360px;overflow:hidden;background:#000}
canvas{width:640px;height:360px;display:block}
</style></head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const W=1280,H=720, GOLD='#e5b84b', GOLD2='#B08D3E', PURPLE2='#3a1a5e';
const logo=new Image(); logo.src='BB_Logo_Purple_2160.png';
let logoReady=false; logo.onload=()=>logoReady=true;
const ease=t=>t<0?0:t>1?1:t*t*(3-2*t);
const easeOutBack=t=>{t=Math.max(0,Math.min(1,t));const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
window.drawFrame=function(t){
  const g=ctx.createRadialGradient(W/2,H/2,60,W/2,H/2,900);
  g.addColorStop(0,PURPLE2); g.addColorStop(1,'#190a2c');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.translate(330,360); ctx.rotate(t*0.12);
  ctx.strokeStyle='rgba(229,184,75,.20)'; ctx.lineWidth=2;
  for(let i=0;i<18;i++){ctx.rotate(Math.PI/9);ctx.beginPath();ctx.moveTo(0,60);ctx.lineTo(0,520);ctx.stroke();}
  ctx.restore();
  const sc=easeOutBack(Math.min(1,t/0.7));
  if(logoReady&&sc>0){
    const size=480*sc;
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,.55)'; ctx.shadowBlur=40; ctx.shadowOffsetY=14;
    ctx.drawImage(logo,330-size/2,360-size/2,size,size);
    ctx.restore();
  }
  const RX=910;
  const a1=ease((t-0.7)/0.4), a2=ease((t-1.0)/0.4), a3=ease((t-1.3)/0.4), a4=ease((t-1.6)/0.5);
  ctx.textAlign='center';
  ctx.save(); ctx.globalAlpha=a1;
  const tag='WE BRING THE TABLES. LITERALLY.';
  let fs=34; ctx.letterSpacing='5px'; ctx.font='600 '+fs+'px Oswald';
  while(ctx.measureText(tag).width>640&&fs>24){fs-=1;ctx.font='600 '+fs+'px Oswald';}
  ctx.fillStyle=GOLD; ctx.fillText(tag,RX,152); ctx.letterSpacing='0px';
  ctx.restore();
  ctx.save(); ctx.globalAlpha=a2;
  ctx.font='72px "Archivo Black"';
  const gg=ctx.createLinearGradient(0,200,0,270);
  gg.addColorStop(0,'#EFCB7C'); gg.addColorStop(1,GOLD2);
  ctx.fillStyle=gg; ctx.fillText('702-706-8287',RX,262);
  ctx.restore();
  ctx.save(); ctx.globalAlpha=a3;
  ctx.font='700 34px Montserrat'; ctx.fillStyle='#F3D88F';
  ctx.fillText('bigbusinesspartyrentals.com',RX,330);
  ctx.font='700 30px Montserrat'; ctx.fillStyle='#efe9dc';
  ctx.fillText('IG  @bigbusiness_rentals_events',RX,384);
  ctx.font='600 26px Oswald'; ctx.fillStyle='rgba(229,184,75,.85)';
  ctx.fillText('L A S   V E G A S ,  N V',RX,436);
  ctx.restore();
  if(a4>0){
    ctx.save(); ctx.globalAlpha=a4;
    const pw=340,ph=70,px=RX-pw/2,py=486;
    const pg=ctx.createLinearGradient(0,py,0,py+ph);
    pg.addColorStop(0,'#EFCB7C'); pg.addColorStop(1,GOLD2);
    ctx.fillStyle=pg; rr(px,py,pw,ph,36); ctx.fill();
    ctx.fillStyle='#1c0b30'; ctx.font='600 36px Oswald';
    ctx.fillText('BOOK YOUR DATE',RX,py+47);
    ctx.restore();
  }
};
</script>
</body></html>
