<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Archivo Black';src:url('fonts/ArchivoBlack.ttf')}
@font-face{font-family:'Oswald';src:url('fonts/Oswald600.ttf');font-weight:600}
@font-face{font-family:'Oswald';src:url('fonts/Oswald500.ttf');font-weight:500}
@font-face{font-family:'Montserrat';src:url('fonts/Mont600.ttf');font-weight:600}
@font-face{font-family:'Montserrat';src:url('fonts/Mont700.ttf');font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden}
body{position:relative;font-family:'Montserrat';color:#f2ecdd;
  background:radial-gradient(circle at 50% 36%, #3a1a5e 0%, #2c1247 55%, #190a2c 100%)}
.rays{position:absolute;inset:-200px;background:repeating-conic-gradient(from 0deg at 50% 38%,
  rgba(229,184,75,.07) 0deg 1deg, transparent 1deg 20deg)}
.frame{position:absolute;inset:30px;border:2px solid #B08D3E}
.frame:after{content:'';position:absolute;inset:7px;border:1px solid rgba(229,184,75,.35)}
.dia{position:absolute;width:11px;height:11px;background:#D6B25E;transform:rotate(45deg)}
.wrap{position:absolute;inset:30px;display:flex;flex-direction:column;align-items:center;text-align:center;padding:46px 70px 44px}
.kick{font-family:'Oswald';font-weight:600;font-size:24px;letter-spacing:9px;color:#D6B25E}
h1{font-family:'Archivo Black';font-size:78px;line-height:1;margin-top:14px;
  background:linear-gradient(180deg,#EFCB7C,#B08D3E);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-family:'Oswald';font-weight:500;font-size:26px;letter-spacing:4px;color:#d9cdb2;margin-top:14px}
.heroimg{margin-top:34px;width:100%;border:2px solid #B08D3E;border-radius:18px;background:rgba(229,184,75,.07);
  display:flex;align-items:center;justify-content:center;padding:36px 0}
.stats{display:flex;gap:22px;margin-top:30px;width:100%}
.stat{flex:1;border:2px solid #B08D3E;border-radius:16px;background:rgba(229,184,75,.08);padding:20px 12px}
.stat .n{font-family:'Archivo Black';font-size:44px;color:#E5B84B}
.stat .l{font-family:'Oswald';font-weight:500;font-size:19px;letter-spacing:2.5px;color:#c9bda4;margin-top:6px}
.foot{margin-top:auto;display:flex;align-items:center;gap:24px}
.foot img{width:82px;height:82px}
.foot .p{font-family:'Archivo Black';font-size:36px;color:#E5B84B;text-align:left}
.foot .s{font-weight:600;font-size:21px;color:#d9cdb2;margin-top:3px;text-align:left}
</style></head>
<body>
  <div class="rays"></div>
  <div class="frame"></div>
  <div class="dia" style="left:25px;top:25px"></div><div class="dia" style="right:25px;top:25px"></div>
  <div class="dia" style="left:25px;bottom:25px"></div><div class="dia" style="right:25px;bottom:25px"></div>
  <div class="wrap">
    <div class="kick">◆&nbsp; INVENTORY SPOTLIGHT &nbsp;◆</div>
    <h1>THE 6FT TABLE:<br>THE WORKHORSE.</h1>
    <div class="sub">BUFFET LINE · GIFT TABLE · DINNER ROW · DJ BOOTH — IT DOES IT ALL</div>
    <div class="heroimg">
      <svg width="560" height="200" viewBox="0 0 280 100" fill="none" stroke="#E5B84B" stroke-width="3">
        <path d="M16 30h248l-20 16H36z" fill="rgba(229,184,75,.12)"/>
        <path d="M42 46v42M238 46v42"/>
        <path d="M30 88h24M226 88h24"/>
        <path d="M60 30l14-12h132l14 12" stroke-opacity=".6"/>
      </svg>
    </div>
    <div class="stats">
      <div class="stat"><div class="n">6 FT</div><div class="l">LONG · FOLDS FLAT</div></div>
      <div class="stat"><div class="n">8</div><div class="l">SEATS COMFORTABLY</div></div>
      <div class="stat"><div class="n">ANY #</div><div class="l">YOU NEED, WE GOT</div></div>
    </div>
    <div class="foot">
      <img src="bb_logo.png">
      <div>
        <div class="p">703-786-8369</div>
        <div class="s">@bigbusiness_rentals_events &nbsp;·&nbsp; SERVING ALL OF LAS VEGAS, NV</div>
      </div>
    </div>
  </div>
</body></html>
