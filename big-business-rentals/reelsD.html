<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Archivo Black';src:url('fonts/ArchivoBlack.ttf')}
@font-face{font-family:'Oswald';src:url('fonts/Oswald600.ttf');font-weight:600}
@font-face{font-family:'Montserrat';src:url('fonts/Mont700.ttf');font-weight:700}
@font-face{font-family:'Montserrat';src:url('fonts/Mont600.ttf');font-weight:600}
html,body{margin:0;padding:0;width:540px;height:960px;overflow:hidden;background:#000}
canvas{width:540px;height:960px;display:block}
</style></head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W=1080,H=1920, FLOOR=1560;

const logo = new Image(); window.logoReady=false; logo.onload=()=>{window.logoReady=true;}; logo.src='BB_Logo_Purple_2160.png';
let logoReady=false; logo.onload=()=>logoReady=true;

// ---------- helpers ----------
const rad = d=>d*Math.PI/180;
const lerp=(a,b,t)=>a+(b-a)*Math.max(0,Math.min(1,t));
const ease=t=>t<0?0:t>1?1:t*t*(3-2*t);
const easeOutBack=t=>{t=Math.max(0,Math.min(1,t));const c=1.70158;return 1+ (c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
function seg(x,y,ang,len){return [x+Math.sin(rad(ang))*len, y+Math.cos(rad(ang))*len];}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

const INK='#241a10', SKIN='#a06a42', SKIN2='#7a4e33', TEE='#f2ede2', PANT='#c9a55a', SHOE='#fdfdfd',
      PURPLE='#2c1247', PURPLE2='#3a1a5e', GOLD='#e5b84b', GOLD2='#B08D3E', PINK='#ff2ea6';

// ---------- chair (side view, backrest on right) ----------
function drawChair(cx, wob, broken, dropT, col){
  const C = Object.assign({a:'#eef0f2', b:'#e3e6ea', c:'#f7f8fa'}, col||{});
  // cx: x of seat center at floor; wob: rock angle deg; broken: 0..1 splay; dropT: seat fall 0..1
  const seatY0 = FLOOR-200, seatW=230, legLen=185;
  ctx.save();
  ctx.translate(cx, FLOOR);
  ctx.rotate(rad(wob));
  ctx.lineWidth=16; ctx.strokeStyle=INK; ctx.lineCap='round';
  const splay = broken*38;             // legs splay out
  const drop  = dropT*(legLen-55);     // seat falls
  // rear legs (right, holds backrest)
  ctx.save();
  ctx.translate(seatW/2-20, 0);
  ctx.rotate(rad(14+splay));
  ctx.fillStyle=C.a;
  rr(-14,-legLen,28,legLen,12); ctx.fill(); ctx.stroke();
  ctx.restore();
  // front legs (left)
  ctx.save();
  ctx.translate(-seatW/2+20, 0);
  ctx.rotate(rad(-14-splay));
  ctx.fillStyle=C.b;
  rr(-14,-legLen,28,legLen,12); ctx.fill(); ctx.stroke();
  ctx.restore();
  const seatY = -legLen+30+drop;
  // seat
  ctx.save();
  ctx.translate(0, seatY);
  ctx.rotate(rad(broken*10));
  ctx.fillStyle=C.c;
  rr(-seatW/2-14, -16, seatW+28, 40, 14); ctx.fill(); ctx.stroke();
  ctx.restore();
  // backrest (attached to rear legs top)
  ctx.save();
  const bx = (seatW/2-20)+Math.sin(rad(14+splay))*(-legLen), by = Math.cos(rad(14+splay))*(-legLen);
  ctx.translate(bx,by+drop*0.9);
  ctx.rotate(rad(-(14+splay)*0.4 + broken*22));
  ctx.fillStyle=C.c;
  rr(-22,-150,44,150,15); ctx.fill(); ctx.stroke();
  rr(-92,-162,184,58,17); ctx.fill(); ctx.stroke();
  ctx.restore();
  ctx.restore();
}

// ---------- man ----------
// pose: x,y(hip), face(1 right,-1 left), lean (torso deg, + = lean back),
// legs [{hip,knee}...] angles: hip 0=down, + forward; walkT for bob; rot: whole-body rotation (fall)
function drawMan(p){
  const S = Object.assign({tee:TEE, teeShade:'#e4ddc9', cap:'#4b2377', skin:SKIN, pant:PANT, pantBack:'#a8874a', capless:false, fem:false}, p.style||{});
  ctx.save();
  ctx.translate(p.x,p.y);
  ctx.rotate(rad(p.rot||0));
  ctx.scale(p.face,1);
  ctx.lineWidth=12; ctx.strokeStyle=INK; ctx.lineCap='round'; ctx.lineJoin='round';
  const thigh=118, shin=116;
  // legs
  [1,0].forEach((i,ord)=>{
    const L=p.legs[i];
    const back=(ord===0);
    const [kx,ky]=seg(0,6, L.hip, thigh);
    const [fx,fy]=seg(kx,ky, L.hip+L.knee, shin);
    ctx.lineWidth=54; ctx.strokeStyle=back?S.pantBack:S.pant;
    ctx.beginPath();ctx.moveTo(0,6);ctx.lineTo(kx,ky);ctx.lineTo(fx,fy);ctx.stroke();
    ctx.lineWidth=11; ctx.strokeStyle=INK;
    ctx.beginPath();ctx.moveTo(0,6);ctx.lineTo(kx,ky);ctx.lineTo(fx,fy);ctx.stroke();
    ctx.save();
    ctx.translate(fx,fy); ctx.rotate(rad(-(L.hip+L.knee)*0.2));
    ctx.fillStyle=back?'#dedede':SHOE;
    rr(-26,-14,102,42,19); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#b9bec4'; rr(-26,16,102,12,6); ctx.fill();
    ctx.restore();
  });
  // torso
  ctx.save();
  ctx.rotate(rad(-(p.lean||0)));
  ctx.fillStyle=S.tee;
  ctx.beginPath();
  if(S.slim){
    ctx.moveTo(-42,14);
    ctx.bezierCurveTo(-74,-70,-66,-196,-32,-228);
    ctx.bezierCurveTo(6,-250,56,-238,68,-192);
    ctx.bezierCurveTo(96,-122,96,-42,72,10);
  } else {
    ctx.moveTo(-58,14);
    ctx.bezierCurveTo(-108,-66,-98,-196,-42,-232);
    ctx.bezierCurveTo(8,-258,78,-242,94,-188);
    ctx.bezierCurveTo(150,-116,156,-36,120,10);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle=S.teeShade;
  if(S.slim){ ctx.beginPath(); ctx.ellipse(44,-62,34,74,rad(-12),0,7); ctx.fill(); }
  else { ctx.beginPath(); ctx.ellipse(72,-56,56,82,rad(-14),0,7); ctx.fill(); }
  ctx.strokeStyle=INK; ctx.lineWidth=8;
  if(S.slim){ ctx.beginPath(); ctx.moveTo(-38,8); ctx.quadraticCurveTo(16,26,70,4); ctx.stroke(); }
  else { ctx.beginPath(); ctx.moveTo(-54,8); ctx.quadraticCurveTo(38,30,116,4); ctx.stroke(); }
  // gold chain
  ctx.strokeStyle=GOLD; ctx.lineWidth=10;
  ctx.beginPath(); ctx.moveTo(2,-220); ctx.quadraticCurveTo(58,-164,92,-192); ctx.stroke();
  // back arm (optional)
  if(p.arm2){
    const B=p.arm2;
    ctx.save();
    ctx.translate(-6,-202);
    const [ex2,ey2]=seg(0,0, B.sh, 100);
    const [hx2,hy2]=seg(ex2,ey2, B.sh+B.el, 96);
    ctx.lineWidth=46; ctx.strokeStyle='#d8d2c2';
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(ex2,ey2);ctx.stroke();
    ctx.lineWidth=34; ctx.strokeStyle=SKIN2;
    ctx.beginPath();ctx.moveTo(ex2,ey2);ctx.lineTo(hx2,hy2);ctx.stroke();
    ctx.lineWidth=11; ctx.strokeStyle=INK;
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(ex2,ey2);ctx.lineTo(hx2,hy2);ctx.stroke();
    ctx.fillStyle=SKIN2; ctx.beginPath(); ctx.arc(hx2,hy2,23,0,7); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  // arm
  const A=p.arm||{sh:35, el:40};
  ctx.save();
  ctx.translate(30,-198);
  const [ex,ey]=seg(0,0, A.sh, 100);
  const [hx,hy]=seg(ex,ey, A.sh+A.el, 96);
  ctx.lineWidth=46; ctx.strokeStyle=S.tee;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(ex,ey);ctx.stroke();
  ctx.lineWidth=34; ctx.strokeStyle=SKIN;
  ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(hx,hy);ctx.stroke();
  ctx.lineWidth=11; ctx.strokeStyle=INK;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(ex,ey);ctx.lineTo(hx,hy);ctx.stroke();
  ctx.fillStyle=SKIN; ctx.beginPath(); ctx.arc(hx,hy,23,0,7); ctx.fill(); ctx.stroke();
  ctx.restore();
  // head (drawn AFTER arm so it overlaps)
  ctx.save();
  ctx.translate(30,-252); ctx.rotate(rad(p.headTilt||0));
  ctx.lineWidth=11;
  // SEASON TWO hair that hangs BEHIND the head (drawn before the face)
  if(S.hair) ctx.strokeStyle=INK;
  if(S.hair==='braids'){
    ctx.lineCap='round';
    for(let i=0;i<9;i++){
      const ax=-74+i*9, ay=-112+i*9, L=230-i*8, ex=ax-26+i*2, ey=ay+L;
      ctx.strokeStyle=INK; ctx.lineWidth=17; ctx.beginPath(); ctx.moveTo(ax,ay); ctx.quadraticCurveTo(ax-16,(ay+ey)/2,ex,ey); ctx.stroke();
      ctx.strokeStyle='#241a10'; ctx.lineWidth=11; ctx.beginPath(); ctx.moveTo(ax,ay); ctx.quadraticCurveTo(ax-16,(ay+ey)/2,ex,ey); ctx.stroke();
      ctx.strokeStyle='#4a3626'; ctx.lineWidth=3;
      for(let k=0.12;k<0.95;k+=0.1){ const bx=(1-k)*(1-k)*ax+2*(1-k)*k*(ax-16)+k*k*ex, by=(1-k)*(1-k)*ay+2*(1-k)*k*((ay+ey)/2)+k*k*ey;
        ctx.beginPath(); ctx.moveTo(bx-5,by-3); ctx.lineTo(bx+5,by+3); ctx.stroke(); }
      ctx.fillStyle=GOLD; ctx.beginPath(); ctx.arc(ex,ey+4,6,0,7); ctx.fill();
    }
    ctx.strokeStyle=INK; ctx.lineWidth=11;
  } else if(S.hair==='locbun'){
    ctx.lineCap='round';
    [[-70,-112,-104,-40],[-60,-118,-92,-24],[-78,-104,-118,-58]].forEach(([x0,y0,x1,y1])=>{
      ctx.strokeStyle=INK; ctx.lineWidth=20; ctx.beginPath(); ctx.moveTo(x0,y0); ctx.quadraticCurveTo(x0-24,(y0+y1)/2,x1,y1); ctx.stroke();
      ctx.strokeStyle='#2b1f14'; ctx.lineWidth=13; ctx.beginPath(); ctx.moveTo(x0,y0); ctx.quadraticCurveTo(x0-24,(y0+y1)/2,x1,y1); ctx.stroke();
    });
    ctx.strokeStyle=INK; ctx.lineWidth=11;
  } else if(S.hair==='locs'){
    ctx.lineCap='round';
    for(let i=0;i<5;i++){ const ax=-70+i*6, ay=-100+i*12, ex=ax-14, ey=ay+96;
      ctx.strokeStyle=INK; ctx.lineWidth=20; ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(ex,ey); ctx.stroke();
      ctx.strokeStyle='#2b1f14'; ctx.lineWidth=13; ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(ex,ey); ctx.stroke(); }
    ctx.strokeStyle=INK; ctx.lineWidth=11;
  }
  ctx.fillStyle=S.skin;
  ctx.beginPath(); ctx.arc(0,-56,72,0,7); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(-52,-52,15,0,7); ctx.fill(); ctx.stroke(); // ear
  // backwards cap: dome on top + strap at back
  if(S.hair==='braids'){
    // long individual braids: the cap of parted hair (the braids themselves hang behind, drawn earlier)
    ctx.fillStyle='#241a10';
    ctx.beginPath(); ctx.arc(0,-66,75,rad(176),rad(362)); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle='#4a3626'; ctx.lineWidth=4;
    for(let i=0;i<6;i++){ const a=rad(196+i*26); ctx.beginPath(); ctx.moveTo(Math.cos(a)*30,-66+Math.sin(a)*30); ctx.lineTo(Math.cos(a)*70,-66+Math.sin(a)*70); ctx.stroke(); }
    ctx.strokeStyle=INK; ctx.lineWidth=11;
  } else if(S.hair==='bun'){
    // Mr. Big Business, Season Two: smooth hair pulled straight back, ponytail tied into one round bun (NOT locs: no strands, no texture lines)
    ctx.fillStyle='#1e1710';
    ctx.beginPath(); ctx.arc(-58,-130,34,0,7); ctx.fill(); ctx.stroke();                      // the bun, top-back
    ctx.beginPath(); ctx.moveTo(-72,-50); ctx.arc(0,-62,73,rad(190),rad(318));                 // slicked back: hairline sweeps up off the forehead
    ctx.quadraticCurveTo(26,-104,-30,-84); ctx.quadraticCurveTo(-56,-76,-72,-50); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.lineWidth=9;                                  // smooth shine
    ctx.beginPath(); ctx.arc(0,-62,56,rad(225),rad(292)); ctx.stroke();
    ctx.beginPath(); ctx.arc(-58,-130,20,rad(200),rad(280)); ctx.stroke();
    ctx.strokeStyle=GOLD; ctx.lineWidth=8;                                                     // hair tie wrapped at the base of the bun
    ctx.beginPath(); ctx.arc(-58,-130,34,rad(30),rad(100)); ctx.stroke();
    ctx.strokeStyle=INK; ctx.lineWidth=11;
  } else if(S.hair==='locbun'||S.hair==='locs'){
    // locs: dark cap with rope texture; locbun adds the coiled bun at the back
    ctx.fillStyle='#241a10';
    ctx.beginPath(); ctx.arc(0,-68,73,rad(184),rad(354)); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle='#4a3626'; ctx.lineWidth=5;
    for(let i=0;i<7;i++){ const x=-56+i*17; ctx.beginPath(); ctx.moveTo(x,-80-Math.abs(i-3)*2); ctx.quadraticCurveTo(x-10,-112,x-24,-132+Math.abs(i-3)*6); ctx.stroke(); }
    ctx.strokeStyle=INK; ctx.lineWidth=11;
    if(S.hair==='locbun'){
      ctx.fillStyle='#241a10';
      [[-66,-124,22],[-48,-134,20],[-80,-108,18]].forEach(([x,y,r])=>{ ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); ctx.stroke(); });
      ctx.strokeStyle=GOLD; ctx.lineWidth=7; ctx.beginPath(); ctx.arc(-58,-118,30,rad(20),rad(110)); ctx.stroke();   // hair tie glint
      ctx.strokeStyle=INK; ctx.lineWidth=11;
    } else {
      ctx.lineCap='round';
      [[-40,-90,-52,-40],[-58,-84,-70,-30]].forEach(([x0,y0,x1,y1])=>{   // side locs in front of the ear
        ctx.strokeStyle=INK; ctx.lineWidth=20; ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
        ctx.strokeStyle='#2b1f14'; ctx.lineWidth=13; ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke(); });
      ctx.strokeStyle=INK; ctx.lineWidth=11;
    }
  } else if(S.fem){
    ctx.fillStyle='#241a10';
    ctx.beginPath(); ctx.arc(0,-64,76,rad(168),rad(372)); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(-44,-136,36,0,7); ctx.fill(); ctx.stroke();   // bun
    ctx.strokeStyle=GOLD; ctx.lineWidth=8;
    ctx.beginPath(); ctx.arc(-44,-136,44,rad(120),rad(300)); ctx.stroke(); // scrunchie glint
    ctx.strokeStyle=INK; ctx.lineWidth=11;
    // gold hoop earring
    ctx.strokeStyle=GOLD; ctx.lineWidth=7;
    ctx.beginPath(); ctx.arc(-52,-18,17,rad(-30),rad(210)); ctx.stroke();
    ctx.strokeStyle=INK; ctx.lineWidth=11;
  } else if(!S.capless){
  ctx.fillStyle=S.cap;
  ctx.beginPath(); ctx.arc(0,-62,74,rad(175),rad(355)); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-70,-84); ctx.quadraticCurveTo(-128,-76,-124,-56);
  ctx.quadraticCurveTo(-90,-56,-66,-62); ctx.closePath(); ctx.fill(); ctx.stroke();  // back brim
  ctx.fillStyle=GOLD; ctx.beginPath(); ctx.arc(6,-96,10,0,7); ctx.fill();  // cap button
  } else if(S.manbun){
    // SEASON TWO: hair pulled back into a ponytail bun (Mr. Big Business + Lil Big Business)
    ctx.fillStyle='#1e1710';
    ctx.beginPath(); ctx.arc(0,-68,72,rad(186),rad(352)); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(-62,-120,30,26,rad(-20),0,7); ctx.fill(); ctx.stroke();   // the bun
    ctx.strokeStyle='#3a2a1a'; ctx.lineWidth=8;
    ctx.beginPath(); ctx.moveTo(-44,-104); ctx.lineTo(-36,-96); ctx.stroke();               // hair tie
    ctx.strokeStyle=INK; ctx.lineWidth=11;
  } else if(S.fade){
    ctx.fillStyle='#1e1710';
    ctx.beginPath();
    ctx.moveTo(-68,-58);
    ctx.quadraticCurveTo(-82,-112,-34,-136);
    ctx.lineTo(48,-128);
    ctx.lineTo(44,-102);
    ctx.quadraticCurveTo(-6,-118,-44,-100);
    ctx.quadraticCurveTo(-62,-86,-68,-58);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  } else {
    ctx.fillStyle='#241a10';
    ctx.beginPath(); ctx.arc(0,-70,68,rad(180),rad(360)); ctx.closePath(); ctx.fill(); ctx.stroke(); // short hair
  }
  // eyes (front = +x)
  if(p.eyes==='x'){
    ctx.lineWidth=8; ctx.strokeStyle=INK;
    [[26,-56],[54,-50]].forEach(([x,y])=>{
      ctx.beginPath();ctx.moveTo(x-9,y-9);ctx.lineTo(x+9,y+9);ctx.moveTo(x+9,y-9);ctx.lineTo(x-9,y+9);ctx.stroke();
    });
  } else if(p.eyes==='wide'){
    ctx.fillStyle='#fff'; ctx.lineWidth=6;
    ctx.beginPath();ctx.arc(28,-56,15,0,7);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.arc(56,-50,13,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle=INK;
    ctx.beginPath();ctx.arc(31,-54,6,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(58,-48,5.5,0,7);ctx.fill();
  } else {
    ctx.fillStyle=INK;
    ctx.beginPath();ctx.arc(28,-56,7,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(56,-50,6.5,0,7);ctx.fill();
  }
  // brows
  ctx.lineWidth=8; ctx.strokeStyle=INK;
  ctx.beginPath();ctx.moveTo(18,-76);ctx.lineTo(38,-72);ctx.stroke();
  ctx.beginPath();ctx.moveTo(48,-68);ctx.lineTo(64,-64);ctx.stroke();
  // mouth + chin beard line
  if(p.mouth==='o'){ctx.fillStyle='#5a2c22';ctx.beginPath();ctx.ellipse(46,-16,13,18,0,0,7);ctx.fill();ctx.stroke();}
  else if(p.mouth==='sad'){ctx.beginPath();ctx.arc(44,0,15,rad(200),rad(340));ctx.stroke();}
  else {ctx.beginPath();ctx.arc(40,-26,16,rad(30),rad(140));ctx.stroke();}
  // goatee (men) / lashes (women)
  if(S.beard){
    // SEASON TWO: full beard + mustache (Mr. Big Business only)
    ctx.fillStyle='#1e1710'; ctx.lineWidth=7;
    ctx.beginPath(); ctx.arc(0,-56,76,rad(10),rad(170));
    ctx.quadraticCurveTo(-30,-14,18,-4); ctx.quadraticCurveTo(50,0,62,-30); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle='#4a3626'; ctx.lineWidth=3;                                                // a little beard texture
    for(let i=0;i<5;i++){ ctx.beginPath(); ctx.moveTo(-30+i*20,-4+Math.abs(i-2)*4); ctx.lineTo(-24+i*20,8+Math.abs(i-2)*3); ctx.stroke(); }
    ctx.strokeStyle=INK;
    ctx.lineWidth=11;
    if(p.mouth==='o'){ctx.fillStyle='#5a2c22';ctx.beginPath();ctx.ellipse(46,-16,13,18,0,0,7);ctx.fill();ctx.stroke();}
    else if(p.mouth==='sad'){ctx.strokeStyle='#f3e7d3';ctx.lineWidth=6;ctx.beginPath();ctx.arc(44,0,15,rad(200),rad(340));ctx.stroke();ctx.strokeStyle=INK;}
    else {ctx.strokeStyle='#f3e7d3';ctx.lineWidth=6;ctx.beginPath();ctx.arc(40,-26,16,rad(30),rad(140));ctx.stroke();ctx.strokeStyle=INK;}
  } else if(!S.fem && S.goatee!==false){
    ctx.fillStyle='#241a10';
    ctx.beginPath(); ctx.ellipse(46,4,14,10,0,0,7); ctx.fill();
  } else if(S.fem){
    ctx.lineWidth=5; ctx.strokeStyle=INK;
    ctx.beginPath();ctx.moveTo(20,-68);ctx.lineTo(12,-74);ctx.stroke();
    ctx.beginPath();ctx.moveTo(50,-62);ctx.lineTo(44,-69);ctx.stroke();
  }
  ctx.restore();
  ctx.restore();
  ctx.restore();
}
// ---------- fx ----------
function starburst(x,y,s,label){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rad(-8)); ctx.scale(s,s);
  ctx.beginPath();
  const spikes=14;
  for(let i=0;i<spikes*2;i++){
    const a=i*Math.PI/spikes, r=i%2? 118:205+(i%4)*24;
    ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r*0.82);
  }
  ctx.closePath();
  ctx.fillStyle='#ffd94d'; ctx.fill();
  ctx.lineWidth=12; ctx.strokeStyle=INK; ctx.stroke();
  ctx.fillStyle=INK;
  ctx.font='66px "Archivo Black"'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(label,0,6);
  ctx.restore();
}
function dust(x,y,t){ // t 0..1
  if(t<=0||t>=1)return;
  ctx.save(); ctx.globalAlpha=(1-t)*0.8;
  for(let i=0;i<7;i++){
    const a=i/7*Math.PI, r=40+t*150+(i%3)*22;
    ctx.fillStyle='#cfc8bb';
    ctx.beginPath(); ctx.arc(x+Math.cos(a+2)*r*1.3, y-Math.abs(Math.sin(a))*r*0.5, 26+18*(1-t),0,7); ctx.fill();
  }
  ctx.restore();
}
function dizzyStars(x,y,t){
  ctx.save();
  for(let i=0;i<3;i++){
    const a=t*4+i*2.09;
    const sx=x+Math.cos(a)*95, sy=y+Math.sin(a)*26 - 8;
    ctx.save(); ctx.translate(sx,sy); ctx.rotate(a); ctx.fillStyle=GOLD;
    ctx.beginPath();
    for(let k=0;k<10;k++){const r=k%2?7:17, aa=k*Math.PI/5;ctx.lineTo(Math.cos(aa)*r,Math.sin(aa)*r);}
    ctx.closePath(); ctx.fill(); ctx.strokeStyle=INK; ctx.lineWidth=3; ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}
function caption(lines,y,popT,size){
  if(window.NOCAP) return;
  const s=size||64;
  const sc=easeOutBack(popT);
  if(sc<=0)return;
  ctx.save(); ctx.translate(W/2,y); ctx.scale(sc,sc);
  ctx.font=s+'px "Archivo Black"'; ctx.textAlign='center';

function drawBowlD(x,y,count,scale){

  ctx.beginPath(); ctx.ellipse(x,y,85,18,0,0,7); ctx.fillStyle='#8f54bd'; ctx.fill(); ctx.stroke();
  const cols=['#ff8c2e','#f6c231','#e05252','#9fe24f','#ffb3cf','#ff8c2e'];

    ctx.lineWidth=4; ctx.stroke(); ctx.lineWidth=8;
  }
  ctx.restore();
}

function lightStringD(x0,y0,x1,y1,sag,on,t){

// ---------- UPGRADE Oct 27: word-by-word pop captions (native TikTok/Reels look) ----------
// Each word scales in 0.07s after the last; the newest word flashes gold, then turns white.
function captionPop(lines, y, t0, t, size){
  if(window.NOCAP) return;
  const s=size||60; const el=t-t0; if(el<0) return;
  ctx.save(); ctx.font=s+'px "Archivo Black"'; ctx.textBaseline='alphabetic'; ctx.textAlign='left';
  const sp=ctx.measureText(' ').width; let idx=0;
  lines.forEach((ln,li)=>{
    const words=ln.split(' ');
    const widths=words.map(w=>ctx.measureText(w).width);
    let x=W/2-(widths.reduce((a,b)=>a+b,0)+sp*(words.length-1))/2;
    const yy=y+li*(s*1.18);
    words.forEach((w,wi)=>{
      const k=(el-idx*0.07)/0.18;
      if(k>0){
        const sc=easeOutBack(Math.min(1,k));
        const cx=x+widths[wi]/2;
        ctx.save(); ctx.translate(cx,yy); ctx.scale(sc,sc);
        ctx.lineWidth=16; ctx.strokeStyle=INK; ctx.lineJoin='round';
        ctx.strokeText(w,-widths[wi]/2,0);
        const fresh=(el-idx*0.07)<0.32;
        ctx.fillStyle=fresh?'#ffd94d':'#fff'; ctx.fillText(w,-widths[wi]/2,0);
        ctx.restore();
      }
      x+=widths[wi]+sp; idx++;
    });
  });
  ctx.restore();
}

function confettiBurst(t, t0, x, y, n, spread){
  const e=t-t0; if(e<0||e>2.6) return;
  const cols=['#E5B84B','#ff8c2e','#5fe3ff','#ff5fb0','#9fe24f','#ffffff'];
  ctx.save(); ctx.globalAlpha=Math.min(1,(2.6-e)/0.6);

    const r1=Math.sin(i*12.9898)*43758.5453, r2=Math.sin(i*78.233)*12345.678, r3=Math.sin(i*39.425)*24680.1357;
    const f1=r1-Math.floor(r1), f2=r2-Math.floor(r2), f3=r3-Math.floor(r3);
    const ang=-Math.PI/2+(f1-0.5)*(spread||2.4), sp=700+f2*900;
    const px=x+Math.cos(ang)*sp*e+Math.sin(e*6+i)*18, py=y+Math.sin(ang)*sp*e+900*e*e;
    ctx.save(); ctx.translate(px,py); ctx.rotate(e*(4+f3*8)+i);
    ctx.fillStyle=cols[i%cols.length]; ctx.fillRect(-9,-5,18,10*Math.abs(Math.cos(e*8+i)));
    ctx.restore();
  }
  ctx.restore();
}
